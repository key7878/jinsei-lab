# 英語研究所 学習ログ
# ---------------------------------------------------------------------------
# このファイルを編集して `python3 build.py` を実行すると、
# labs/english.html の「所長の現在地」「C1までの進捗」「拾った単語・フレーズ」
# がすべて自動で更新される。数値はこのファイルの実データからのみ算出する
# (推定値・仮の数値は入れない)。
#
# 【厳守】匿名性維持のため、国名・都市名・企業名・部署名は書かない。
#
# entries への追記フォーマット (新しいものを上に積む必要はない。日付でソートされる):
#
#   - date: 2026-08-11
#     type: phrase          # word（単語） または phrase（フレーズ）
#     term: "get the ball rolling"
#     meaning: "物事を動き出させる"
#     example: "Let's get the ball rolling on this."
#     situation: "会議で話を切り出したかったが、言葉が出てこなかった"
#
# situation = 「それを使いたかった状況」。ここがこの研究所の核なので必ず書く。
# ---------------------------------------------------------------------------

level:
  current: B2
  target: C1

# C1到達の目安。語彙3,000語・フレーズ3,000・学習500〜800時間。
targets:
  words: 3000
  phrases: 3000
  hours_min: 500
  hours_max: 800

# 学習時間の実績(時間)。計測できないので運営者が手動で更新する。
study_hours: 0

entries: []
